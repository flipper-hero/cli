name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          dir="flipper-${{ matrix.target }}"
          mkdir -p "$dir"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/flipper.exe" "$dir/"
          else
            cp "target/${{ matrix.target }}/release/flipper" "$dir/"
          fi
          cp README.md LICENSE "$dir/"
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-${{ matrix.target }}
          path: flipper-${{ matrix.target }}/

  freebsd:
    name: x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo build --release --no-default-features -p flipper-cli
            mkdir -p flipper-x86_64-unknown-freebsd
            cp target/release/flipper flipper-x86_64-unknown-freebsd/
            cp README.md LICENSE flipper-x86_64-unknown-freebsd/
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-x86_64-unknown-freebsd
          path: flipper-x86_64-unknown-freebsd/

  universal-macos:
    name: universal-apple-darwin
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flipper-aarch64-apple-darwin
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: flipper-x86_64-apple-darwin
          path: x64
      - name: Lipo a universal binary
        run: |
          mkdir -p flipper-aarch64-apple-darwin-universal
          lipo -create arm64/flipper x64/flipper -output flipper-aarch64-apple-darwin-universal/flipper
          cp arm64/README.md arm64/LICENSE flipper-aarch64-apple-darwin-universal/
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-aarch64-apple-darwin-universal
          path: flipper-aarch64-apple-darwin-universal/

  release:
    runs-on: ubuntu-latest
    needs: [build, freebsd, universal-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flipper-*
          path: dist
      - name: Package archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="0.0.0-dev"
          mkdir -p out
          for dir in dist/flipper-*/; do
            target=$(basename "$dir")
            if [[ -f "$dir/flipper.exe" ]]; then
              (cd "$dir" && zip -q "../../out/flipper-${VERSION}-${target#flipper-}.zip" flipper.exe README.md LICENSE)
            else
              # upload-artifact does not preserve the executable bit.
              chmod +x "$dir/flipper"
              tar czf "out/flipper-${VERSION}-${target#flipper-}.tar.gz" -C "$dir" flipper README.md LICENSE
            fi
          done
          (cd out && sha256sum * > ../sha256sums.txt)
          mv sha256sums.txt out/
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## flipper ${GITHUB_REF_NAME#v}"
            echo
            echo "One static binary per platform — download for your machine, unpack, run."
            echo
            echo '```'
            echo "tar xzf flipper-${GITHUB_REF_NAME#v}-aarch64-apple-darwin.tar.gz"
            echo "./flipper info"
            echo '```'
            echo
            echo "The macOS universal build runs on Apple silicon and Intel."
            echo "Linux builds need glibc and libudev; the FreeBSD build is static."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "flipper ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
